name: quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and reconcile the lockfile
        run: npm install

      - name: Verify a clean install from the reconciled lockfile
        run: npm ci

      - name: Preserve the resolved lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-package-lock
          path: package-lock.json
          retention-days: 1

      - name: Build production application
        run: npm run build

      - name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Commit the verified lockfile when it changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "The package lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): synchronize npm lockfile"
          git push origin HEAD:master
